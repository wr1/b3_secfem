[project]
name = "b3_secfem"
version = "0.1.0"
description = "Lightweight FEniCSx-based 2D cross-section property solver for composite blade/wing sections."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Note: fenics-dolfinx, petsc4py, mpi4py, fenics-ufl, fenics-basix are not
# distributed as PyPI binary wheels. Install them via the system package
# manager (Ubuntu/Debian: `apt install fenicsx python3-dolfinx`) or
# conda-forge/pixi, then create the project venv with
# `uv venv --system-site-packages` so they remain visible.
dependencies = [
    "meshio>=5.3",
    # numpy is pinned <2 to match the ABI of the system (apt) fenics-dolfinx /
    # petsc4py build, which is compiled against numpy 1.26.x. Installing numpy 2
    # makes `import dolfinx` fail with a binary-incompatibility ValueError in
    # petsc4py. (The mfem 4.8 wheel imports fine under numpy 1.26 despite its
    # declared numba dependency wanting numpy>=2 -- numba is a soft dep here.)
    "numpy<2",
    "pydantic>=2",
    "rich",
    "b3_mat",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "matplotlib"]
# airfoilmesh is the sibling ``b3_af`` package (not published to PyPI). The
# airfoil-section tests skip when it is absent, so it is opt-in: install with
# ``pip install -e ../b3_af`` (see Makefile) to exercise them locally.
airfoil = ["airfoilmesh"]
# Install with: uv pip install --only-binary=:all: 'mfem>=4.8'  (only the 4.8
# wheels are published for cp312; older versions are sdist-only and need a
# native MFEM toolchain). Then re-pin numpy: uv pip install 'numpy<2'.
mfem = ["mfem>=4.8", "scipy>=1.10"]  # PyMFEM serial + scipy for the singular nullspace solves

[project.scripts]
b3_secfem = "b3_secfem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/b3_secfem"]

# In the b3_master uv workspace, b3_mat resolves via `workspace = true` and
# airfoilmesh is unused. For standalone use, the Makefile's `install` target
# installs both as path-editable sources (../b3_mat, ../b3_af).

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests gate dolfinx imports behind pytest.importorskip(), so the heavy
# imports must legitimately come after a module-level statement.
"tests/*" = ["E402"]
# 'I' is the conventional symbol for the second moment of area; keep it.
"tests/_meshlib.py" = ["E402", "E741"]
