# CI lint job (pre-commit/action). Local commits use .githooks (ruff check
# + format --check on src/ + tests/). Do not `pre-commit install` while
# core.hooksPath is .githooks — that would overwrite the versioned hook.
# Run all files:
#   pre-commit run --all-files
# Or: make pre-commit
#
# Rule config lives in pyproject.toml. Scoped to src/ + tests/ (matches
# `make lint`; examples/ stay out of the gate).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(src|tests|README\.md|pyproject\.toml)$
      - id: end-of-file-fixer
        files: ^(src|tests|README\.md|pyproject\.toml)$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
