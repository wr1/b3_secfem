name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # dolfinx is not on PyPI. FE tests skip via importorskip.
      # b3_mat is the optional b3mat extra, not a core dependency.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q --tb=short tests/

  # PyMFEM wheel path (no dolfinx). mfem is a Linux core dependency.
  test-mfem:
    name: test-mfem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run mfem-gated tests
        env:
          # The C tracer re-executes numpy and hits "cannot load module more
          # than once per process". sysmon measures lines; branch stays off
          # in ci/mfem-coverage.ini so coverage does not fall back to it.
          COVERAGE_CORE: sysmon
        run: |
          python -m coverage run --rcfile=ci/mfem-coverage.ini -m pytest -q --tb=short -p no:cov \
            tests/test_mfem_backend.py \
            tests/test_bulk_assemble.py \
            tests/test_golden_mfem.py
          python -m coverage report --rcfile=ci/mfem-coverage.ini \
            --include='*/backends/mfem.py' --fail-under=70

  lock:
    name: uv lock --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check lockfile
        run: uv lock --check
